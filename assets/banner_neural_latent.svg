<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Neural Latent Space &amp; Vector Embeddings Banner</title>
  <desc>Neural Latent Space and High-Dimensional Vector Visualization for Saffron Singh</desc>

  <defs>
    <linearGradient id="bg-neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#050913" />
    </linearGradient>

    <linearGradient id="border-neural" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="neural-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-neural" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="75%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#6366f1" />
    </radialGradient>

    <pattern id="neural-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="0.65" fill="#334155" fill-opacity="0.22" />
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.3" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 4px; fill: #f8fafc; }
    .title-sub { font-weight: 600; font-size: 13.5px; fill: #38bdf8; letter-spacing: 0.2px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .tag-meta { font-size: 8.5px; font-weight: 600; fill: #64748b; letter-spacing: 1.5px; }
    .lbl-node { font-size: 7.5px; font-weight: 600; fill: #94a3b8; text-anchor: middle; letter-spacing: 0.5px; }
    .lbl-core { font-size: 9.5px; font-weight: 800; fill: #ffffff; text-anchor: middle; letter-spacing: 1.6px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #818cf8; letter-spacing: 1.4px; }
    .readout-key { font-size: 9px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#bg-neural)" stroke="url(#border-neural)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#neural-grid)" />

  <!-- Corner Accents -->
  <path d="M 12 22 L 12 12 L 22 12" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.45" />
  <path d="M 868 22 L 868 12 L 858 12" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.45" />
  <path d="M 12 228 L 12 238 L 22 238" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.45" />
  <path d="M 868 228 L 868 238 L 858 238" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.45" />

  <!-- ZONE 1: LEFT — IDENTITY -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2" fill="#6366f1" />
      <text x="12" y="7" class="mono tag-meta">NEURAL LATENT RESEARCH</text>
    </g>
    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#6366f1">•</tspan> AI Agents <tspan fill="#6366f1">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      High-dimensional embeddings &amp; intelligent reasoning systems
    </text>
  </g>

  <!-- ZONE 2: CENTER — NEURAL LATENT MANIFOLD -->
  <g id="neural-manifold">
    <!-- Breathing Ambient Halo -->
    <circle cx="492" cy="125" r="110" fill="url(#neural-glow)">
      <animate attributeName="r" values="95;120;95" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Curved High-Dimensional Tensor Beziers -->
    <path d="M 380 70 C 430 110 450 120 492 125" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#38bdf8;#1e293b" dur="3.6s" repeatCount="indefinite" />
    </path>
    <path d="M 380 180 C 430 140 450 130 492 125" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#6366f1;#1e293b" dur="4.2s" repeatCount="indefinite" />
    </path>
    <path d="M 492 125 C 530 120 560 110 605 70" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#38bdf8;#1e293b" dur="3.8s" repeatCount="indefinite" />
    </path>
    <path d="M 492 125 C 530 130 560 140 605 180" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#6366f1;#1e293b" dur="4.6s" repeatCount="indefinite" />
    </path>
    <path d="M 440 40 C 480 80 490 100 492 125" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#818cf8;#1e293b" dur="3.4s" repeatCount="indefinite" />
    </path>
    <path d="M 440 210 C 480 170 490 150 492 125" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#38bdf8;#1e293b" dur="4.0s" repeatCount="indefinite" />
    </path>
    <path d="M 550 40 C 510 80 500 100 492 125" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#6366f1;#1e293b" dur="4.4s" repeatCount="indefinite" />
    </path>
    <path d="M 550 210 C 510 170 500 150 492 125" fill="none" stroke="#1e293b" stroke-width="0.8">
      <animate attributeName="stroke" values="#1e293b;#38bdf8;#1e293b" dur="3.7s" repeatCount="indefinite" />
    </path>

    <!-- Cross Attention Tensors (Dashed) -->
    <path d="M 380 70 Q 492 40 605 70" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4" />
    <path d="M 380 180 Q 492 210 605 180" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4" />
    <path d="M 380 70 L 380 180" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3" />
    <path d="M 605 70 L 605 180" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3" />

    <!-- Particle Flow: Attention Pulses -->
    <circle r="2" fill="#38bdf8">
      <animateMotion path="M 380 70 C 430 110 450 120 492 125 C 530 130 560 140 605 180" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#818cf8">
      <animateMotion path="M 380 180 C 430 140 450 130 492 125 C 530 120 560 110 605 70" dur="5.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="5.6s" repeatCount="indefinite" />
    </circle>
    <circle r="1.8" fill="#38bdf8">
      <animateMotion path="M 440 40 C 480 80 490 100 492 125 L 550 210" dur="4.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="4.4s" repeatCount="indefinite" />
    </circle>

    <!-- Peripheral Feature Nodes -->
    <!-- Left Input Cluster -->
    <g transform="translate(380, 70)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">TOKEN</text>
    </g>
    <g transform="translate(380, 180)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#6366f1;#334155" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">VECTOR</text>
    </g>
    <g transform="translate(440, 40)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">EMBED</text>
    </g>
    <g transform="translate(440, 210)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="4.0s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">CONTEXT</text>
    </g>

    <!-- Right Output Cluster -->
    <g transform="translate(550, 40)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#6366f1;#334155" dur="4.4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">LOGIT</text>
    </g>
    <g transform="translate(550, 210)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.7s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">POLICY</text>
    </g>
    <g transform="translate(605, 70)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.8s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">ACTION</text>
    </g>
    <g transform="translate(605, 180)">
      <circle cx="0" cy="0" r="11" fill="#070c18" stroke="#334155" stroke-width="0.9">
        <animate attributeName="stroke" values="#334155;#6366f1;#334155" dur="4.6s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">SCHEMA</text>
    </g>

    <!-- Central Core: LATENT REASONING HUB -->
    <g transform="translate(492, 125)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.35">
        <animate attributeName="r" values="26;33;26" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.08;0.4" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="19" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="22" fill="url(#core-neural)" stroke="#6366f1" stroke-width="1.6">
        <animate attributeName="stroke" values="#6366f1;#38bdf8;#6366f1" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3.5" class="mono lbl-core">LATENT</text>
    </g>
  </g>

  <!-- ZONE 3: RIGHT — VECTOR TELEMETRY (Seamless Atmospheric Readout) -->
  <g id="neural-readout" transform="translate(720, 56)">
    <text x="0" y="10" class="mono readout-title">SYS // EMBEDDINGS</text>
    <line x1="0" y1="20" x2="110" y2="20" stroke="#1e293b" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">DIMENSION</text>
      <text x="110" y="0" class="mono readout-val" text-anchor="end">1536-D</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">ATTENTION</text>
      <text x="110" y="0" class="mono readout-val" text-anchor="end">MULTI-HEAD</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">INFERENCE</text>
      <text x="110" y="0" class="mono readout-val" text-anchor="end">14 ms</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">STATE</text>
      <text x="110" y="0" class="mono readout-val" text-anchor="end" fill="#10b981">CONVERGED</text>
    </g>

    <line x1="0" y1="126" x2="110" y2="126" stroke="#1e293b" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#64748b">
        <tspan fill="#38bdf8">❯</tspan> query --vector
      </text>
      <rect x="76" y="-8" width="3.5" height="8" fill="#38bdf8" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
