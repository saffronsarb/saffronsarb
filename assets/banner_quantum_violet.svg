<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Quantum Entanglement &amp; Superposition Banner</title>
  <desc>Quantum Computing &amp; Probability Dynamics for Saffron Singh</desc>

  <defs>
    <linearGradient id="bg-quantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0314" />
      <stop offset="50%" stop-color="#18072b" />
      <stop offset="100%" stop-color="#0e0419" />
    </linearGradient>

    <linearGradient id="border-quantum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="quantum-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#f43f5e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b0314" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-quantum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fae8ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>

    <pattern id="quantum-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="26" cy="26" r="0.6" fill="#a855f7" fill-opacity="0.18" />
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#581c87" stroke-width="0.3" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 4px; fill: #faf5ff; }
    .title-sub { font-weight: 600; font-size: 13px; fill: #c084fc; letter-spacing: 0.2px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #e9d5ff; opacity: 0.8; }
    .tag-meta { font-size: 8.5px; font-weight: 600; fill: #9333ea; letter-spacing: 1.5px; }
    .lbl-node { font-size: 7.5px; font-weight: 700; fill: #e9d5ff; text-anchor: middle; letter-spacing: 0.5px; }
    .lbl-core { font-size: 8.5px; font-weight: 800; fill: #ffffff; text-anchor: middle; letter-spacing: 1.4px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #a855f7; letter-spacing: 1.4px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #d8b4fe; opacity: 0.7; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #faf5ff; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#bg-quantum)" stroke="url(#border-quantum)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#quantum-grid)" />

  <!-- Corner Tech Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.45" />
  <path d="M 868 24 L 868 12 L 856 12" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.45" />
  <path d="M 12 226 L 12 238 L 24 238" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.45" />
  <path d="M 868 226 L 868 238 L 856 238" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.45" />

  <!-- ZONE 1: LEFT — IDENTITY -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2" fill="#a855f7" />
      <text x="12" y="7" class="mono tag-meta">QUANTUM PROBABILISTIC SYSTEMS</text>
    </g>
    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#f43f5e">•</tspan> AI Agents <tspan fill="#f43f5e">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      Probabilistic reasoning, state superposition &amp; intelligent search
    </text>
  </g>

  <!-- ZONE 2: CENTER — QUANTUM ENTANGLEMENT & BLOCH ORBITALS -->
  <g id="quantum-lattice">
    <!-- Atmospheric Quantum Halo -->
    <circle cx="496" cy="125" r="115" fill="url(#quantum-glow)">
      <animate attributeName="r" values="98;122;98" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6.5s" repeatCount="indefinite" />
    </circle>

    <!-- Entangled Infinity / Figure-8 Waveform Paths -->
    <path d="M 400 125 C 400 70 460 70 496 125 C 532 180 592 180 592 125 C 592 70 532 70 496 125 C 460 180 400 180 400 125 Z" fill="none" stroke="#581c87" stroke-width="1">
      <animate attributeName="stroke" values="#581c87;#c084fc;#f43f5e;#581c87" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 400 125 C 400 180 460 180 496 125 C 532 70 592 70 592 125 C 592 180 532 180 496 125 C 460 70 400 70 400 125 Z" fill="none" stroke="#581c87" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6">
      <animate attributeName="stroke" values="#581c87;#f43f5e;#c084fc;#581c87" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Concentric Probability Orbit Circles -->
    <circle cx="496" cy="125" r="82" fill="none" stroke="#581c87" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.4" />

    <!-- Entangled Qubit Photons (Phase-Locked Oscillators) -->
    <circle r="2.4" fill="#fae8ff">
      <animateMotion path="M 400 125 C 400 70 460 70 496 125 C 532 180 592 180 592 125 C 592 70 532 70 496 125 C 460 180 400 180 400 125 Z" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;1;0.4" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="2.2" fill="#f43f5e">
      <animateMotion path="M 592 125 C 592 70 532 70 496 125 C 460 180 400 180 400 125 C 400 70 460 70 496 125 C 532 180 592 180 592 125 Z" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;1;0.4" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Peripheral Quantum State Gates -->
    <g transform="translate(390, 68)">
      <circle cx="0" cy="0" r="12" fill="#140624" stroke="#581c87" stroke-width="1">
        <animate attributeName="stroke" values="#581c87;#a855f7;#581c87" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">HADAMARD</text>
    </g>
    <g transform="translate(390, 182)">
      <circle cx="0" cy="0" r="12" fill="#140624" stroke="#581c87" stroke-width="1">
        <animate attributeName="stroke" values="#581c87;#f43f5e;#581c87" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">CNOT</text>
    </g>
    <g transform="translate(496, 42)">
      <circle cx="0" cy="0" r="11" fill="#140624" stroke="#581c87" stroke-width="1">
        <animate attributeName="stroke" values="#581c87;#c084fc;#581c87" dur="3.0s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">PHASE</text>
    </g>
    <g transform="translate(496, 208)">
      <circle cx="0" cy="0" r="11" fill="#140624" stroke="#581c87" stroke-width="1">
        <animate attributeName="stroke" values="#581c87;#a855f7;#581c87" dur="4.0s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">COLLAPSE</text>
    </g>
    <g transform="translate(602, 68)">
      <circle cx="0" cy="0" r="12" fill="#140624" stroke="#581c87" stroke-width="1">
        <animate attributeName="stroke" values="#581c87;#f43f5e;#581c87" dur="3.8s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">ENTANGLE</text>
    </g>
    <g transform="translate(602, 182)">
      <circle cx="0" cy="0" r="12" fill="#140624" stroke="#581c87" stroke-width="1">
        <animate attributeName="stroke" values="#581c87;#c084fc;#581c87" dur="4.4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">SUPERPOS</text>
    </g>

    <!-- Central Quantum Core Hub -->
    <g transform="translate(496, 125)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.3">
        <animate attributeName="r" values="26;33;26" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.35;0.08;0.35" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="20" fill="url(#core-quantum)" stroke="#f43f5e" stroke-width="1.6">
        <animate attributeName="stroke" values="#f43f5e;#a855f7;#f43f5e" dur="3.8s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3.5" class="mono lbl-core">QUBIT</text>
    </g>
  </g>

  <!-- ZONE 3: RIGHT — QUANTUM TELEMETRY -->
  <g id="quantum-telemetry" transform="translate(720, 54)">
    <text x="0" y="10" class="mono readout-title">SYS // QUANTUM CORE</text>
    <line x1="0" y1="20" x2="114" y2="20" stroke="#581c87" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">QUBITS</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">128 LOGICAL</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">FIDELITY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">99.98%</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">COHERENCE T2</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">124.6 μs</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">STATE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#c084fc">SUPERPOS</text>
    </g>

    <line x1="0" y1="126" x2="114" y2="126" stroke="#581c87" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#9333ea">
        <tspan fill="#a855f7">❯</tspan> qubit.measure()
      </text>
      <rect x="80" y="-8" width="3.5" height="8" fill="#a855f7" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
