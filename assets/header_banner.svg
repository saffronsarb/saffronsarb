<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Real-Time Streaming &amp; Waveform Banner</title>
  <desc>Real-Time Streaming Voice Intelligence &amp; Waveform Telemetry for Saffron Singh</desc>

  <defs>
    <linearGradient id="bg-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#070e22" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="border-mono" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="mono-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="#334155" fill-opacity="0.25" />
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.25" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 4px; fill: #f8fafc; }
    .title-sub { font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 0.2px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .tag-meta { font-size: 8.5px; font-weight: 600; fill: #64748b; letter-spacing: 1.5px; }
    .wave-badge { font-size: 8px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.8px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #06b6d4; letter-spacing: 1.4px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#bg-mono)" stroke="url(#border-mono)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#mono-grid)" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
    <line x1="12" y1="16" x2="20" y2="16" />
    <line x1="16" y1="12" x2="16" y2="20" />
    <line x1="860" y1="16" x2="868" y2="16" />
    <line x1="864" y1="12" x2="864" y2="20" />
    <line x1="12" y1="234" x2="20" y2="234" />
    <line x1="16" y1="230" x2="16" y2="238" />
    <line x1="860" y1="234" x2="868" y2="234" />
    <line x1="864" y1="230" x2="864" y2="238" />
  </g>

  <!-- ZONE 1: LEFT — IDENTITY -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2" fill="#06b6d4" />
      <text x="12" y="7" class="mono tag-meta">REAL-TIME STREAMING SYSTEMS</text>
    </g>
    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#06b6d4">•</tspan> AI Agents <tspan fill="#06b6d4">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      Low-latency audio streaming, voice agents &amp; inference pipelines
    </text>
  </g>

  <!-- ZONE 2: CENTER — STREAMING WAVEFORM & SPECTRAL HARMONICS -->
  <g id="stream-waveform" transform="translate(380, 40)">
    <!-- Background Spectral Frame -->
    <rect x="0" y="10" width="310" height="150" rx="8" fill="#050a18" fill-opacity="0.6" stroke="#1e293b" stroke-width="0.7" />

    <!-- Frequency Grid Lines -->
    <line x1="15" y1="85" x2="295" y2="85" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="155" y1="20" x2="155" y2="150" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Primary Harmonic Sine Wave -->
    <path d="M 20 85 Q 55 35 90 85 T 160 85 T 230 85 T 290 85" fill="none" stroke="url(#wave-grad-1)" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="d"
        values="M 20 85 Q 55 35 90 85 T 160 85 T 230 85 T 290 85; M 20 85 Q 55 135 90 85 T 160 85 T 230 85 T 290 85; M 20 85 Q 55 35 90 85 T 160 85 T 230 85 T 290 85"
        dur="3.8s" repeatCount="indefinite" />
    </path>

    <!-- Secondary Carrier Harmonic Wave -->
    <path d="M 20 85 Q 55 120 90 85 T 160 85 T 230 85 T 290 85" fill="none" stroke="url(#wave-grad-2)" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
      <animate attributeName="d"
        values="M 20 85 Q 55 120 90 85 T 160 85 T 230 85 T 290 85; M 20 85 Q 55 50 90 85 T 160 85 T 230 85 T 290 85; M 20 85 Q 55 120 90 85 T 160 85 T 230 85 T 290 85"
        dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Tertiary High-Frequency Wave -->
    <path d="M 20 85 Q 38 70 56 85 T 92 85 T 128 85 T 164 85 T 200 85 T 236 85 T 272 85 T 290 85" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.45" stroke-dasharray="2 2" />

    <!-- Spectrogram Bars (Voice / Token Dynamics) -->
    <!-- 15 Audio Spectrogram Bars -->
    <g transform="translate(30, 85)">
      <!-- Bar 1 -->
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="-8;-18;-6;-8" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y2" values="8;18;6;8" dur="1.2s" repeatCount="indefinite" />
      </line>
      <!-- Bar 2 -->
      <line x1="18" y1="-14" x2="18" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <animate attributeName="y1" values="-14;-28;-10;-14" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="14;28;10;14" dur="1.5s" repeatCount="indefinite" />
      </line>
      <!-- Bar 3 -->
      <line x1="36" y1="-22" x2="36" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <animate attributeName="y1" values="-22;-38;-12;-22" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y2" values="22;38;12;22" dur="1.1s" repeatCount="indefinite" />
      </line>
      <!-- Bar 4 -->
      <line x1="54" y1="-10" x2="54" y2="10" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <animate attributeName="y1" values="-10;-24;-8;-10" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="y2" values="10;24;8;10" dur="1.7s" repeatCount="indefinite" />
      </line>
      <!-- Bar 5 -->
      <line x1="72" y1="-30" x2="72" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.95">
        <animate attributeName="y1" values="-30;-45;-18;-30" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="30;45;18;30" dur="1.3s" repeatCount="indefinite" />
      </line>
      <!-- Bar 6 -->
      <line x1="90" y1="-16" x2="90" y2="16" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <animate attributeName="y1" values="-16;-32;-10;-16" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y2" values="16;32;10;16" dur="1.4s" repeatCount="indefinite" />
      </line>
      <!-- Bar 7 -->
      <line x1="108" y1="-36" x2="108" y2="36" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.95">
        <animate attributeName="y1" values="-36;-48;-20;-36" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="y2" values="36;48;20;36" dur="1.6s" repeatCount="indefinite" />
      </line>
      <!-- Bar 8 -->
      <line x1="126" y1="-26" x2="126" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <animate attributeName="y1" values="-26;-42;-14;-26" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y2" values="26;42;14;26" dur="1.2s" repeatCount="indefinite" />
      </line>
      <!-- Bar 9 -->
      <line x1="144" y1="-40" x2="144" y2="40" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="1">
        <animate attributeName="y1" values="-40;-52;-22;-40" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y2" values="40;52;22;40" dur="1.8s" repeatCount="indefinite" />
      </line>
      <!-- Bar 10 -->
      <line x1="162" y1="-20" x2="162" y2="20" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <animate attributeName="y1" values="-20;-34;-12;-20" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="20;34;12;20" dur="1.3s" repeatCount="indefinite" />
      </line>
      <!-- Bar 11 -->
      <line x1="180" y1="-28" x2="180" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <animate attributeName="y1" values="-28;-44;-16;-28" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="28;44;16;28" dur="1.5s" repeatCount="indefinite" />
      </line>
      <!-- Bar 12 -->
      <line x1="198" y1="-14" x2="198" y2="14" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <animate attributeName="y1" values="-14;-26;-8;-14" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y2" values="14;26;8;14" dur="1.1s" repeatCount="indefinite" />
      </line>
      <!-- Bar 13 -->
      <line x1="216" y1="-24" x2="216" y2="24" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <animate attributeName="y1" values="-24;-38;-12;-24" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y2" values="24;38;12;24" dur="1.4s" repeatCount="indefinite" />
      </line>
      <!-- Bar 14 -->
      <line x1="234" y1="-12" x2="234" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="-12;-22;-6;-12" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="y2" values="12;22;6;12" dur="1.6s" repeatCount="indefinite" />
      </line>
      <!-- Bar 15 -->
      <line x1="252" y1="-6" x2="252" y2="6" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.5">
        <animate attributeName="y1" values="-6;-14;-4;-6" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="6;14;4;6" dur="1.3s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Floating Stream Badges -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#080e22" stroke="#38bdf8" stroke-width="0.6" />
      <circle cx="8" cy="9" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="12" class="mono wave-badge">WEBRTC LIVE</text>
    </g>
    <g transform="translate(210, 24)">
      <rect x="0" y="0" width="80" height="18" rx="4" fill="#080e22" stroke="#818cf8" stroke-width="0.6" />
      <text x="40" y="12" class="mono wave-badge" text-anchor="middle" fill="#c7d2fe">84.6 TOK/S</text>
    </g>
  </g>

  <!-- ZONE 3: RIGHT — STREAM TELEMETRY READOUT -->
  <g id="stream-telemetry" transform="translate(720, 54)">
    <text x="0" y="10" class="mono readout-title">SYS // STREAM ENGINE</text>
    <line x1="0" y1="20" x2="114" y2="20" stroke="#1e293b" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">LATENCY (E2E)</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">&lt; 120 ms</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">AUDIO CODEC</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">OPUS 24k</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">PIPELINE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">VAD+LLM+TTS</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">STATE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#10b981">STREAMING</text>
    </g>

    <line x1="0" y1="126" x2="114" y2="126" stroke="#1e293b" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#64748b">
        <tspan fill="#06b6d4">❯</tspan> stream.listen()
      </text>
      <rect x="80" y="-8" width="3.5" height="8" fill="#06b6d4" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
