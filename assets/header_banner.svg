<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Multi-Agent Orchestration Mesh Banner</title>
  <desc>Autonomous Multi-Agent Consensus &amp; DAG Orchestration for Saffron Singh</desc>

  <defs>
    <linearGradient id="bg-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#070d1e" />
      <stop offset="100%" stop-color="#040817" />
    </linearGradient>

    <linearGradient id="border-mesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="mesh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hub-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 4px; fill: #f8fafc; }
    .title-sub { font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 0.2px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .tag-meta { font-size: 8.5px; font-weight: 600; fill: #64748b; letter-spacing: 1.5px; }
    .lbl-node { font-size: 7.5px; font-weight: 700; fill: #cbd5e1; text-anchor: middle; letter-spacing: 0.6px; }
    .lbl-hub { font-size: 8.5px; font-weight: 800; fill: #ffffff; text-anchor: middle; letter-spacing: 1.4px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.4px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#bg-mesh)" stroke="url(#border-mesh)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#dot-grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
  <path d="M 868 24 L 868 12 L 856 12" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.4" />
  <path d="M 12 226 L 12 238 L 24 238" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.4" />
  <path d="M 868 226 L 868 238 L 856 238" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />

  <!-- ZONE 1: LEFT — IDENTITY -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2" fill="#38bdf8" />
      <text x="12" y="7" class="mono tag-meta">AGENTIC SYSTEMS LAB</text>
    </g>
    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#6366f1">•</tspan> AI Agents <tspan fill="#6366f1">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      Autonomous coordination, consensus &amp; multi-agent protocols
    </text>
  </g>

  <!-- ZONE 2: CENTER — MULTI-AGENT DAG ORCHESTRATION -->
  <g id="agent-dag">
    <!-- Center Atmosphere Glow -->
    <circle cx="496" cy="125" r="115" fill="url(#mesh-glow)">
      <animate attributeName="r" values="100;125;100" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Outer Orbital Protocol Track -->
    <circle cx="496" cy="125" r="82" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.5" />
    <circle cx="496" cy="125" r="54" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4" />

    <!-- Mesh Interconnections (Spokes from Orchestrator cx=496, cy=125) -->
    <!-- Node 1: PLANNER (425, 60) -->
    <line x1="496" y1="125" x2="425" y2="60" stroke="#334155" stroke-width="0.8">
      <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.5s" repeatCount="indefinite" />
    </line>
    <!-- Node 2: RETRIEVER (567, 60) -->
    <line x1="496" y1="125" x2="567" y2="60" stroke="#334155" stroke-width="0.8">
      <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="3.8s" repeatCount="indefinite" />
    </line>
    <!-- Node 3: REASONER (585, 125) -->
    <line x1="496" y1="125" x2="585" y2="125" stroke="#334155" stroke-width="0.8">
      <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.2s" repeatCount="indefinite" />
    </line>
    <!-- Node 4: CRITIC (567, 190) -->
    <line x1="496" y1="125" x2="567" y2="190" stroke="#334155" stroke-width="0.8">
      <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="4.2s" repeatCount="indefinite" />
    </line>
    <!-- Node 5: EXECUTOR (425, 190) -->
    <line x1="496" y1="125" x2="425" y2="190" stroke="#334155" stroke-width="0.8">
      <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.6s" repeatCount="indefinite" />
    </line>
    <!-- Node 6: MEMORY (407, 125) -->
    <line x1="496" y1="125" x2="407" y2="125" stroke="#334155" stroke-width="0.8">
      <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="4.0s" repeatCount="indefinite" />
    </line>

    <!-- Peripheral Cross-Agent Handoff Chords (DAG Workflow) -->
    <path d="M 425 60 L 567 60" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M 567 60 L 585 125" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M 585 125 L 567 190" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M 567 190 L 425 190" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M 425 190 L 407 125" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M 407 125 L 425 60" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Data Packet Traversal (Circular Consensus Pulse) -->
    <circle r="2.2" fill="#38bdf8">
      <animateMotion path="M 425 60 L 496 125 L 567 60 L 585 125 L 496 125 L 567 190 L 425 190 L 407 125 Z" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#818cf8">
      <animateMotion path="M 585 125 L 567 190 L 496 125 L 425 190 L 407 125 L 425 60 L 496 125 L 567 60 Z" dur="9.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="9.5s" repeatCount="indefinite" />
    </circle>

    <!-- Peripheral Agent Nodes -->
    <!-- PLANNER -->
    <g transform="translate(425, 60)">
      <circle cx="0" cy="0" r="14" fill="#080e1e" stroke="#334155" stroke-width="1">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3" class="mono lbl-node">PLAN</text>
    </g>
    <!-- RETRIEVER -->
    <g transform="translate(567, 60)">
      <circle cx="0" cy="0" r="14" fill="#080e1e" stroke="#334155" stroke-width="1">
        <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="3.8s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3" class="mono lbl-node">RAG</text>
    </g>
    <!-- REASONER -->
    <g transform="translate(585, 125)">
      <circle cx="0" cy="0" r="14" fill="#080e1e" stroke="#334155" stroke-width="1">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3" class="mono lbl-node">THINK</text>
    </g>
    <!-- CRITIC -->
    <g transform="translate(567, 190)">
      <circle cx="0" cy="0" r="14" fill="#080e1e" stroke="#334155" stroke-width="1">
        <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3" class="mono lbl-node">EVAL</text>
    </g>
    <!-- EXECUTOR -->
    <g transform="translate(425, 190)">
      <circle cx="0" cy="0" r="14" fill="#080e1e" stroke="#334155" stroke-width="1">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3" class="mono lbl-node">ACT</text>
    </g>
    <!-- MEMORY -->
    <g transform="translate(407, 125)">
      <circle cx="0" cy="0" r="14" fill="#080e1e" stroke="#334155" stroke-width="1">
        <animate attributeName="stroke" values="#334155;#818cf8;#334155" dur="4.0s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3" class="mono lbl-node">MEM</text>
    </g>

    <!-- Central Hub: MASTER ORCHESTRATOR -->
    <g transform="translate(496, 125)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3">
        <animate attributeName="r" values="26;32;26" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.35;0.08;0.35" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="20" fill="url(#hub-core)" stroke="#38bdf8" stroke-width="1.6">
        <animate attributeName="stroke" values="#38bdf8;#818cf8;#38bdf8" dur="4.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3.5" class="mono lbl-hub">ORCH</text>
    </g>
  </g>

  <!-- ZONE 3: RIGHT — AGENT TELEMETRY READOUT -->
  <g id="agent-telemetry" transform="translate(718, 54)">
    <text x="0" y="10" class="mono readout-title">SYS // ORCHESTRATION</text>
    <line x1="0" y1="20" x2="114" y2="20" stroke="#1e293b" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">TOPOLOGY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">A2A MESH</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">CONSENSUS</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">BYZANTINE</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">ACTIVE DAG</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">6 WORKERS</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">HEALTH</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#10b981">SYNCED</text>
    </g>

    <line x1="0" y1="126" x2="114" y2="126" stroke="#1e293b" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#64748b">
        <tspan fill="#38bdf8">❯</tspan> agent.dispatch()
      </text>
      <rect x="88" y="-8" width="3.5" height="8" fill="#38bdf8" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
