<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Amber Phosphor CRT Cyberdeck Banner</title>
  <desc>Retro-Futuristic Amber Phosphor Terminal &amp; Hex Memory Matrix for Saffron Singh</desc>

  <defs>
    <linearGradient id="crt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0501" />
      <stop offset="50%" stop-color="#140b02" />
      <stop offset="100%" stop-color="#080400" />
    </linearGradient>

    <linearGradient id="crt-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffb000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8" />
    </linearGradient>

    <!-- CRT Scanline Pattern -->
    <pattern id="crt-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.45" />
      <line x1="0" y1="2" x2="100" y2="2" stroke="#ffb000" stroke-width="0.3" opacity="0.08" />
    </pattern>

    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a0501" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'VT323', 'Courier New', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .crt-title { font-weight: 900; font-size: 40px; letter-spacing: 6px; fill: #fffbeb; }
    .crt-sub { font-weight: 700; font-size: 12.5px; fill: #ffb000; letter-spacing: 1px; }
    .crt-desc { font-weight: 500; font-size: 11px; fill: #fde68a; opacity: 0.85; }
    .crt-tag { font-size: 8.5px; font-weight: 800; fill: #ffb000; letter-spacing: 2px; }
    .hex-text { font-size: 8.5px; fill: #d97706; opacity: 0.75; letter-spacing: 0.8px; }
    .hex-active { fill: #fffbeb; font-weight: 700; }
    .telemetry-title { font-size: 9px; font-weight: 800; fill: #ffb000; letter-spacing: 1.6px; }
    .telemetry-key { font-size: 8.5px; font-weight: 600; fill: #b45309; letter-spacing: 0.8px; }
    .telemetry-val { font-size: 9px; font-weight: 700; fill: #fef3c7; letter-spacing: 0.5px; }
  </style>

  <!-- Outer CRT Curved Bezel -->
  <rect x="1" y="1" width="878" height="248" rx="14" fill="url(#crt-bg)" stroke="url(#crt-border)" stroke-width="1.4" />
  <rect x="2" y="2" width="876" height="246" rx="13" fill="url(#crt-scanlines)" />

  <!-- CRT Tube Corner Vignette Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#ffb000" stroke-width="1.4" opacity="0.6" />
  <path d="M 864 32 L 864 16 L 848 16" fill="none" stroke="#ffb000" stroke-width="1.4" opacity="0.6" />
  <path d="M 16 218 L 16 234 L 32 234" fill="none" stroke="#ffb000" stroke-width="1.4" opacity="0.6" />
  <path d="M 864 218 L 864 234 L 848 234" fill="none" stroke="#ffb000" stroke-width="1.4" opacity="0.6" />

  <!-- ZONE 1: LEFT — CRT BOOT SEQUENCE & IDENTITY -->
  <g transform="translate(48, 48)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="14" height="7" fill="#ffb000" />
      <text x="22" y="7" class="mono crt-tag">CYBERDECK AMBER // VT-220</text>
    </g>
    <text x="0" y="54" class="sans crt-title">SAFFRON SINGH</text>
    <text x="0" y="84" class="mono crt-sub">
      AI/ML DEVELOPER <tspan fill="#f59e0b">•</tspan> AGENTIC SYSTEMS <tspan fill="#f59e0b">•</tspan> RESEARCH
    </text>
    <text x="0" y="108" class="mono crt-desc">
      [BOOT] Kernel v4.19-AI loaded: Multi-Agent Consensus &amp; Voice RAG
    </text>

    <!-- Boot Status Ticker -->
    <g transform="translate(0, 134)">
      <text x="0" y="0" class="mono" font-size="9" fill="#ffb000">
        ROM: <tspan fill="#fff">640 KB</tspan> | MEM: <tspan fill="#fff">128 MB EXT</tspan> | CLOCK: <tspan fill="#fff">4.77 MHz TURBO</tspan>
      </text>
    </g>
  </g>

  <!-- ZONE 2: CENTER — PHOSPHOR OSCILLOSCOPE & HEX STREAM -->
  <g id="amber-oscilloscope" transform="translate(490, 45)">
    <!-- Oscilloscope Display Frame -->
    <rect x="0" y="0" width="190" height="160" rx="8" fill="#0d0601" stroke="#78350f" stroke-width="0.8" />
    <circle cx="95" cy="80" r="70" fill="url(#amber-glow)" />

    <!-- Oscilloscope Reticle Lines -->
    <line x1="15" y1="80" x2="175" y2="80" stroke="#78350f" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="95" y1="15" x2="95" y2="145" stroke="#78350f" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Live Phosphor Waveform (Sine Resonance) -->
    <path d="M 15 80 Q 40 30 65 80 T 115 80 T 165 80 T 175 80" fill="none" stroke="#ffb000" stroke-width="2" stroke-linecap="round">
      <animate attributeName="d"
        values="M 15 80 Q 40 30 65 80 T 115 80 T 165 80 T 175 80; M 15 80 Q 40 130 65 80 T 115 80 T 165 80 T 175 80; M 15 80 Q 40 30 65 80 T 115 80 T 165 80 T 175 80"
        dur="3s" repeatCount="indefinite" />
    </path>

    <!-- Ghost Trace Echo -->
    <path d="M 15 80 Q 40 50 65 80 T 115 80 T 165 80 T 175 80" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5">
      <animate attributeName="d"
        values="M 15 80 Q 40 50 65 80 T 115 80 T 165 80 T 175 80; M 15 80 Q 40 110 65 80 T 115 80 T 165 80 T 175 80; M 15 80 Q 40 50 65 80 T 115 80 T 165 80 T 175 80"
        dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Floating Phosphor Beam Dot -->
    <circle r="3" fill="#ffffff">
      <animateMotion path="M 15 80 L 65 50 L 115 110 L 165 80" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Mini Frequency Readout in Frame -->
    <text x="12" y="24" class="mono" font-size="8" font-weight="700" fill="#ffb000">RES: 440 Hz</text>
    <text x="178" y="24" class="mono" font-size="8" font-weight="700" fill="#fef3c7" text-anchor="end">LIVE</text>
  </g>

  <!-- ZONE 3: RIGHT — CRT TELEMETRY & BLINKING CURSOR -->
  <g id="crt-telemetry" transform="translate(712, 48)">
    <text x="0" y="10" class="mono telemetry-title">SYS // PHOSPHOR CORE</text>
    <line x1="0" y1="18" x2="124" y2="18" stroke="#78350f" stroke-width="0.8" />

    <g transform="translate(0, 36)">
      <text x="0" y="0" class="mono telemetry-key">PHOSPHOR</text>
      <text x="124" y="0" class="mono telemetry-val" text-anchor="end">P31 AMBER</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="0" class="mono telemetry-key">BAUD RATE</text>
      <text x="124" y="0" class="mono telemetry-val" text-anchor="end">115200 bps</text>
    </g>
    <g transform="translate(0, 80)">
      <text x="0" y="0" class="mono telemetry-key">DAG MESH</text>
      <text x="124" y="0" class="mono telemetry-val" text-anchor="end">6 WORKERS</text>
    </g>
    <g transform="translate(0, 102)">
      <text x="0" y="0" class="mono telemetry-key">PARITY</text>
      <text x="124" y="0" class="mono telemetry-val" text-anchor="end" fill="#ffb000">EVEN / OK</text>
    </g>

    <line x1="0" y1="116" x2="124" y2="116" stroke="#78350f" stroke-width="0.8" />

    <g transform="translate(0, 134)">
      <text x="0" y="0" class="mono" font-size="8" fill="#d97706">
        <tspan fill="#ffb000">❯</tspan> deck.execute()
      </text>
      <rect x="88" y="-8" width="4" height="9" fill="#ffb000" opacity="0.9">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
