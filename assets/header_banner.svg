<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Midnight Sapphire Horizon (Aryan Inspired)</title>
  <desc>Deep Midnight Sapphire Canvas &amp; Ice Frost Ambient Waveform for Saffron Singh</desc>

  <defs>
    <linearGradient id="sapphire-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02061b" />
      <stop offset="45%" stop-color="#060e33" />
      <stop offset="100%" stop-color="#030822" />
    </linearGradient>

    <linearGradient id="sapphire-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#c0e4e4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="horizon-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="horizon-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#c0e4e4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="aurora-glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#02061b" stop-opacity="0" />
    </radialGradient>

    <pattern id="sapphire-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.55" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 5px; fill: #ffffff; }
    .title-sub { font-weight: 600; font-size: 13px; fill: #c0e4e4; letter-spacing: 0.3px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #93c5fd; opacity: 0.85; }
    .badge-text { font-size: 8.5px; font-weight: 700; fill: #7dd3fc; letter-spacing: 1.2px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #c0e4e4; letter-spacing: 1.4px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #93c5fd; opacity: 0.75; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#sapphire-bg)" stroke="url(#sapphire-border)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#sapphire-dots)" />

  <!-- Atmospheric Aurora Lighting Sphere -->
  <circle cx="530" cy="115" r="140" fill="url(#aurora-glow)">
    <animate attributeName="r" values="120;150;120" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Undulating Midnight Horizon Waves (Aryan Aesthetic) -->
  <path d="M 0 190 Q 220 140 440 185 T 880 175 L 880 250 L 0 250 Z" fill="url(#horizon-wave-1)">
    <animate attributeName="d"
      values="M 0 190 Q 220 140 440 185 T 880 175 L 880 250 L 0 250 Z; M 0 190 Q 220 210 440 165 T 880 185 L 880 250 L 0 250 Z; M 0 190 Q 220 140 440 185 T 880 175 L 880 250 L 0 250 Z"
      dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M 0 205 Q 220 235 440 195 T 880 210 L 880 250 L 0 250 Z" fill="url(#horizon-wave-2)">
    <animate attributeName="d"
      values="M 0 205 Q 220 235 440 195 T 880 210 L 880 250 L 0 250 Z; M 0 205 Q 220 175 440 215 T 880 195 L 880 250 L 0 250 Z; M 0 205 Q 220 235 440 195 T 880 210 L 880 250 L 0 250 Z"
      dur="12s" repeatCount="indefinite" />
  </path>

  <!-- Top Edge Subtle Ice Beam -->
  <line x1="200" y1="2" x2="680" y2="2" stroke="#38bdf8" stroke-width="1.2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- ZONE 1: LEFT — HIGH-CONTRAST IDENTITY (Aryan Inspired) -->
  <g transform="translate(48, 50)">
    <!-- Identity Pill Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="18" rx="9" fill="#0c1744" stroke="#2563eb" stroke-width="0.7" />
      <circle cx="9" cy="9" r="2.5" fill="#38bdf8" />
      <text x="18" y="12" class="mono badge-text">INTELLIGENT SYSTEMS</text>
    </g>

    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#38bdf8">•</tspan> AI Agents <tspan fill="#38bdf8">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      Multi-agent architectures, reasoning loops &amp; systems engineering
    </text>

    <!-- Technical Interest Chips -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#091438" stroke="#1e3a8a" stroke-width="0.6" />
      <text x="38" y="12" class="mono" font-size="8.5" font-weight="600" fill="#c0e4e4" text-anchor="middle">AI AGENTS</text>
      <rect x="84" y="0" width="88" height="18" rx="4" fill="#091438" stroke="#1e3a8a" stroke-width="0.6" />
      <text x="128" y="12" class="mono" font-size="8.5" font-weight="600" fill="#c0e4e4" text-anchor="middle">NEURAL RAG</text>
      <rect x="180" y="0" width="78" height="18" rx="4" fill="#091438" stroke="#1e3a8a" stroke-width="0.6" />
      <text x="219" y="12" class="mono" font-size="8.5" font-weight="600" fill="#c0e4e4" text-anchor="middle">FASTAPI</text>
    </g>
  </g>

  <!-- ZONE 2: CENTER / RIGHT — CONSTELLATION GRAPH & TELEMETRY -->
  <g id="sapphire-constellation" transform="translate(490, 44)">
    <!-- Constellation Filaments -->
    <line x1="20" y1="50" x2="80" y2="20" stroke="#1e3a8a" stroke-width="0.8" />
    <line x1="80" y1="20" x2="130" y2="65" stroke="#2563eb" stroke-width="0.8" />
    <line x1="130" y1="65" x2="80" y2="110" stroke="#1e3a8a" stroke-width="0.8" />
    <line x1="80" y1="110" x2="20" y2="50" stroke="#2563eb" stroke-width="0.8" />
    <line x1="80" y1="20" x2="80" y2="110" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="20" y1="50" x2="130" y2="65" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Flowing Photon Pulse on Constellation -->
    <circle r="2.2" fill="#c0e4e4">
      <animateMotion path="M 20 50 L 80 20 L 130 65 L 80 110 Z" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Constellation Vertex Nodes -->
    <circle cx="20" cy="50" r="5" fill="#0c1744" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="80" cy="20" r="6" fill="#0c1744" stroke="#c0e4e4" stroke-width="1.4" />
    <circle cx="130" cy="65" r="5" fill="#0c1744" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="80" cy="110" r="5" fill="#0c1744" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Central Glowing Core Node -->
    <circle cx="80" cy="65" r="10" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5">
      <animate attributeName="stroke" values="#ffffff;#38bdf8;#ffffff" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="65" r="3" fill="#ffffff" />
  </g>

  <!-- ZONE 3: RIGHT — SAPPHIRE TELEMETRY READOUT -->
  <g id="sapphire-telemetry" transform="translate(718, 54)">
    <text x="0" y="10" class="mono readout-title">SYS // REASONING CORE</text>
    <line x1="0" y1="20" x2="114" y2="20" stroke="#1e3a8a" stroke-width="0.6" opacity="0.8" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">ARCHITECTURE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">MULTI-AGENT</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">CONSENSUS</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">BYZANTINE</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">LATENCY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">12 ms</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">STATE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#38bdf8">SYNCHRONIZED</text>
    </g>

    <line x1="0" y1="126" x2="114" y2="126" stroke="#1e3a8a" stroke-width="0.6" opacity="0.8" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#93c5fd">
        <tspan fill="#38bdf8">❯</tspan> agent.init()
      </text>
      <rect x="68" y="-8" width="3.5" height="8" fill="#38bdf8" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
