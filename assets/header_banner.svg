<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Neo-Tokyo Synthwave &amp; Cyberpunk Grid Banner</title>
  <desc>Neo-Tokyo Synthwave Horizon, Sliced Sun &amp; 3D Perspective Grid for Saffron Singh</desc>

  <defs>
    <linearGradient id="synth-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090214" />
      <stop offset="50%" stop-color="#1f0738" />
      <stop offset="70%" stop-color="#2d0a4e" />
      <stop offset="100%" stop-color="#0d021c" />
    </linearGradient>

    <linearGradient id="synth-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f706cf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffbe0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b" />
      <stop offset="45%" stop-color="#f706cf" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <radialGradient id="sun-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f706cf" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#ffbe0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090214" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 5px; fill: #ffffff; }
    .title-sub { font-weight: 700; font-size: 13px; fill: #00f0ff; letter-spacing: 0.5px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #f5d0fe; opacity: 0.9; }
    .tag-meta { font-size: 8.5px; font-weight: 800; fill: #f706cf; letter-spacing: 2px; }
    .readout-title { font-size: 8.5px; font-weight: 800; fill: #f706cf; letter-spacing: 1.6px; }
    .readout-key { font-size: 8.5px; font-weight: 600; fill: #c084fc; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #ffbe0b; letter-spacing: 0.5px; }
    .grid-line { stroke: #f706cf; stroke-width: 0.8; opacity: 0.45; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#synth-bg)" stroke="url(#synth-border)" stroke-width="1.2" />

  <!-- 3D PERSPECTIVE WIREFRAME GRID (Receding to Horizon at Y=160) -->
  <!-- Horizontal Distance Lines (exponential spacing) -->
  <line x1="0" y1="162" x2="880" y2="162" stroke="#f706cf" stroke-width="0.5" opacity="0.3" />
  <line x1="0" y1="170" x2="880" y2="170" stroke="#f706cf" stroke-width="0.6" opacity="0.4" />
  <line x1="0" y1="182" x2="880" y2="182" stroke="#f706cf" stroke-width="0.7" opacity="0.5" />
  <line x1="0" y1="198" x2="880" y2="198" stroke="#f706cf" stroke-width="0.8" opacity="0.6" />
  <line x1="0" y1="218" x2="880" y2="218" stroke="#00f0ff" stroke-width="0.9" opacity="0.7" />
  <line x1="0" y1="242" x2="880" y2="242" stroke="#00f0ff" stroke-width="1.1" opacity="0.85" />

  <!-- Vanishing Perspective Lines radiating from Horizon Center (496, 160) -->
  <line x1="496" y1="160" x2="100" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="220" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="340" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="440" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="496" y2="250" class="grid-line" stroke="#00f0ff" stroke-width="1.2" />
  <line x1="496" y1="160" x2="552" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="652" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="772" y2="250" class="grid-line" />
  <line x1="496" y1="160" x2="880" y2="250" class="grid-line" />

  <!-- ZONE 2: CENTER — SYNTHWAVE RADIANT SLICED SUN -->
  <g id="synth-sun">
    <!-- Sun Aura Halo -->
    <circle cx="496" cy="115" r="100" fill="url(#sun-halo)">
      <animate attributeName="r" values="85;105;85" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Solid Sun Disc with Horizontal Venetian Slices -->
    <circle cx="496" cy="115" r="46" fill="url(#sun-grad)" />

    <!-- Horizontal Blinds Cuts (Giving the iconic 80s Synthwave effect) -->
    <rect x="440" y="112" width="112" height="2" fill="#090214" />
    <rect x="440" y="118" width="112" height="3" fill="#090214" />
    <rect x="440" y="125" width="112" height="4" fill="#090214" />
    <rect x="440" y="133" width="112" height="5" fill="#090214" />
    <rect x="440" y="142" width="112" height="6.5" fill="#090214" />
    <rect x="440" y="152" width="112" height="8" fill="#090214" />

    <!-- Horizon Laser Beam -->
    <line x1="300" y1="160" x2="692" y2="160" stroke="#00f0ff" stroke-width="1.8" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </line>

    <!-- Floating Grid Pulse Spark -->
    <circle r="2.5" fill="#00f0ff">
      <animateMotion path="M 496 160 L 496 250" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ZONE 1: LEFT — NEO-TOKYO 2084 IDENTITY -->
  <g transform="translate(48, 50)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="10" height="10" fill="#f706cf" />
      <text x="18" y="9" class="mono tag-meta">NEO-TOKYO 2084 // OVERDRIVE</text>
    </g>
    <!-- Glitch Shadow Behind Name -->
    <text x="-2" y="58" class="sans title-name" fill="#f706cf" opacity="0.6">SAFFRON</text>
    <text x="2" y="58" class="sans title-name" fill="#00f0ff" opacity="0.6">SAFFRON</text>
    <text x="0" y="56" class="sans title-name">SAFFRON</text>

    <text x="0" y="86" class="sans title-sub">
      AI/ML Developer <tspan fill="#f706cf">•</tspan> AI Agents <tspan fill="#f706cf">•</tspan> Software Engineering
    </text>
    <text x="0" y="110" class="sans title-desc">
      Hyper-fast neural synthesis, autonomous agents &amp; futuristic architectures
    </text>
  </g>

  <!-- ZONE 3: RIGHT — SYNTHWAVE TELEMETRY -->
  <g id="synth-telemetry" transform="translate(718, 50)">
    <text x="0" y="10" class="mono readout-title">SYS // OVERDRIVE_84</text>
    <line x1="0" y1="18" x2="114" y2="18" stroke="#f706cf" stroke-width="0.8" />

    <g transform="translate(0, 36)">
      <text x="0" y="0" class="mono readout-key">FRAME RATE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">144 FPS</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="0" class="mono readout-key">WAVE SYNTH</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">SAWTOOTH</text>
    </g>
    <g transform="translate(0, 80)">
      <text x="0" y="0" class="mono readout-key">LATENCY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#00f0ff">ZERO DRIFT</text>
    </g>
    <g transform="translate(0, 102)">
      <text x="0" y="0" class="mono readout-key">STATE</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#f706cf">OVERDRIVE</text>
    </g>

    <line x1="0" y1="116" x2="114" y2="116" stroke="#f706cf" stroke-width="0.8" />

    <g transform="translate(0, 134)">
      <text x="0" y="0" class="mono" font-size="8" fill="#c084fc">
        <tspan fill="#f706cf">❯</tspan> synth.accelerate()
      </text>
      <rect x="96" y="-8" width="3.5" height="8" fill="#00f0ff" opacity="0.9">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
