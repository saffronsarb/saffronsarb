<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250">
    <defs>
        <linearGradient id="bg_bio" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a192f" />
            <stop offset="50%" stop-color="#112240" />
            <stop offset="100%" stop-color="#020c1b" />
        </linearGradient>
        <linearGradient id="grad_bio" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#64ffda" />
            <stop offset="100%" stop-color="#48b598" />
        </linearGradient>
    </defs>
    
    <rect width="880" height="250" fill="url(#bg_bio)" />
    
    <!-- Organic flowing lines -->
    <path d="M-100,125 Q100,50 300,125 T700,125 T1000,125" fill="none" stroke="url(#grad_bio)" stroke-width="2" opacity="0.4">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
            values="M-100,125 Q100,50 300,125 T700,125 T1000,125;
                    M-100,125 Q100,200 300,125 T700,125 T1000,125;
                    M-100,125 Q100,50 300,125 T700,125 T1000,125" />
    </path>
    <path d="M-100,150 Q100,100 400,150 T800,150 T1000,150" fill="none" stroke="#64ffda" stroke-width="1.5" opacity="0.3">
        <animate attributeName="d" dur="12s" repeatCount="indefinite"
            values="M-100,150 Q100,100 400,150 T800,150 T1000,150;
                    M-100,150 Q100,200 400,150 T800,150 T1000,150;
                    M-100,150 Q100,100 400,150 T800,150 T1000,150" />
    </path>

    <!-- Floating bio-nodes -->
    <g fill="#64ffda">
        <circle cx="200" cy="125" r="3" opacity="0.6">
            <animate attributeName="cy" values="125;110;125" dur="4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="500" cy="125" r="4" opacity="0.6">
            <animate attributeName="cy" values="125;140;125" dur="5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite" />
        </circle>
        <circle cx="700" cy="125" r="2.5" opacity="0.6">
            <animate attributeName="cy" values="125;115;125" dur="3.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" />
        </circle>
    </g>

    <text x="440" y="125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'" font-size="42" font-weight="800" fill="#e6f1ff" text-anchor="middle" letter-spacing="4">
        SAFFRON SARBAJNA
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
    </text>
    
    <text x="440" y="165" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8892b0" text-anchor="middle" letter-spacing="3">
        DATA SCIENCE • MACHINE LEARNING • QUANTITATIVE ANALYSIS
    </text>
</svg>