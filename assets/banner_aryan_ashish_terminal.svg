<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Cyber Terminal (Ashish x Aryan Inspired)</title>
  <desc>Developer Terminal with macOS Header, CLI Commands &amp; Ashish/Aryan Aesthetics</desc>

  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040924" />
      <stop offset="50%" stop-color="#080e30" />
      <stop offset="100%" stop-color="#050a26" />
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#00ff9d" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="term-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.25" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Fira Code', 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .term-title { font-size: 11px; fill: #94a3b8; letter-spacing: 0.5px; font-weight: 500; }
    .cmd-prompt { font-size: 11px; font-weight: 700; fill: #00ff9d; }
    .cmd-text { font-size: 11px; font-weight: 500; fill: #f8fafc; }
    .cmd-out { font-size: 10.5px; font-weight: 400; fill: #94a3b8; }
    .cmd-highlight { fill: #38bdf8; font-weight: 600; }
    .hud-label { font-size: 8.5px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.2px; }
    .hud-val { font-size: 9px; font-weight: 700; fill: #f8fafc; }
    .hud-key { font-size: 8.5px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Terminal Window Outer Frame -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1" />
  <rect x="2" y="32" width="876" height="216" rx="0" fill="url(#term-grid)" />

  <!-- macOS Title Bar (Inspired by Ashish) -->
  <path d="M 1 10 C 1 5 5 1 10 1 L 870 1 C 875 1 879 5 879 10 L 879 32 L 1 32 Z" fill="#090e24" />
  <line x1="1" y1="32" x2="879" y2="32" stroke="#1e293b" stroke-width="0.8" />

  <!-- Window Control Traffic Light Dots -->
  <circle cx="20" cy="16.5" r="5" fill="#ff5f56" />
  <circle cx="36" cy="16.5" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="16.5" r="5" fill="#27c93f" />

  <!-- Terminal Tab Title -->
  <text x="440" y="20" class="mono term-title" text-anchor="middle">
    saffron@workstation: ~/intelligent-systems (zsh)
  </text>

  <!-- Terminal Status Pill -->
  <g transform="translate(790, 8)">
    <rect x="0" y="0" width="70" height="17" rx="4" fill="#03071e" stroke="#1e293b" stroke-width="0.6" />
    <circle cx="8" cy="8.5" r="2.5" fill="#00ff9d">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="11.5" class="mono" font-size="8.5" font-weight="700" fill="#00ff9d">ONLINE</text>
  </g>

  <!-- LEFT ZONE: INTERACTIVE CLI COMMAND LOG -->
  <g transform="translate(32, 54)">
    <!-- Line 1: whoami -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" class="mono cmd-prompt">❯ whoami</text>
      <text x="0" y="28" class="mono cmd-out">
        <tspan class="cmd-highlight" font-weight="700">SAFFRON SINGH</tspan> — AI/ML Developer &amp; Systems Engineer
      </text>
    </g>

    <!-- Line 2: cat identity.json -->
    <g transform="translate(0, 46)">
      <text x="0" y="10" class="mono cmd-prompt">❯ cat saffron.config.json</text>
      <text x="0" y="27" class="mono cmd-out">{</text>
      <text x="14" y="43" class="mono cmd-out">"focus": <tspan fill="#00ff9d">"AI Agents, Multi-Agent RAG, Voice AI",</tspan></text>
      <text x="14" y="59" class="mono cmd-out">"stack": <tspan fill="#38bdf8">["Python", "PyTorch", "LangGraph", "C++", "FastAPI"],</tspan></text>
      <text x="14" y="75" class="mono cmd-out">"research": <tspan fill="#e2e8f0">"IIT Jammu Summer School 2026 (Consensus DAG)"</tspan></text>
      <text x="0" y="91" class="mono cmd-out">}</text>
    </g>

    <!-- Line 3: Active Shell Prompt with Blinking Cursor -->
    <g transform="translate(0, 154)">
      <text x="0" y="10" class="mono cmd-prompt">❯ python agent.orchestrate()</text>
      <rect x="215" y="0" width="7" height="13" fill="#00ff9d">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- CENTER / RIGHT ZONE: TACTICAL HUD RADAR & TELEMETRY -->
  <g transform="translate(560, 48)">
    <!-- Background HUD Panel -->
    <rect x="0" y="0" width="290" height="175" rx="8" fill="#030820" fill-opacity="0.85" stroke="#1e293b" stroke-width="0.8" />

    <!-- Mini Radar Scope (Ashish HUD Inspiration) -->
    <g transform="translate(68, 70)">
      <!-- Outer Radar Ring -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#1e293b" stroke-width="0.8" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 3" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00ff9d" stroke-width="0.6" opacity="0.4" />
      <circle cx="0" cy="0" r="2.5" fill="#00ff9d" />

      <!-- Radar Crosshairs -->
      <line x1="-48" y1="0" x2="48" y2="0" stroke="#1e293b" stroke-width="0.6" />
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#1e293b" stroke-width="0.6" />

      <!-- Sweeping Radar Beam (Pure SMIL Rotation) -->
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#00ff9d" stroke-width="1.6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite" />
      </line>

      <!-- Blip 1: Agent Node -->
      <circle cx="20" cy="-22" r="2" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
      </circle>
      <!-- Blip 2: RAG Pipeline -->
      <circle cx="-24" cy="18" r="2" fill="#00ff9d">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Right Telemetry Metrics Column -->
    <g transform="translate(136, 18)">
      <text x="0" y="10" class="mono hud-label">TELEMETRY // SYS</text>
      <line x1="0" y1="18" x2="136" y2="18" stroke="#1e293b" stroke-width="0.6" />

      <g transform="translate(0, 34)">
        <text x="0" y="0" class="mono hud-key">AGENT MESH</text>
        <text x="136" y="0" class="mono hud-val" text-anchor="end" fill="#00ff9d">6 NODES</text>
      </g>
      <g transform="translate(0, 54)">
        <text x="0" y="0" class="mono hud-key">LATENCY</text>
        <text x="136" y="0" class="mono hud-val" text-anchor="end">14 ms</text>
      </g>
      <g transform="translate(0, 74)">
        <text x="0" y="0" class="mono hud-key">MEMORY RAG</text>
        <text x="136" y="0" class="mono hud-val" text-anchor="end">1536-D</text>
      </g>
      <g transform="translate(0, 94)">
        <text x="0" y="0" class="mono hud-key">INTEGRITY</text>
        <text x="136" y="0" class="mono hud-val" text-anchor="end" fill="#38bdf8">OPTIMAL</text>
      </g>
    </g>

    <!-- Bottom CPU Activity Bar -->
    <g transform="translate(16, 138)">
      <text x="0" y="9" class="mono hud-key" font-size="8">THROUGHPUT</text>
      <rect x="70" y="2" width="186" height="8" rx="2" fill="#080e22" stroke="#1e293b" stroke-width="0.5" />
      <rect x="71" y="3" width="145" height="6" rx="1.5" fill="#00ff9d" opacity="0.85">
        <animate attributeName="width" values="120;160;135;170;145" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
