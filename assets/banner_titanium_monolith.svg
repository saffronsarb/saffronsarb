<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Titanium Monolith &amp; Isometric Architecture Banner</title>
  <desc>Monochrome Luxury Titanium &amp; 3D Isometric Hypercube for Saffron Singh</desc>

  <defs>
    <linearGradient id="bg-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>

    <linearGradient id="border-titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f8fafc" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="titanium-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-titanium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <pattern id="titanium-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="0.55" fill="#94a3b8" fill-opacity="0.22" />
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.25" stroke-opacity="0.16" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 5px; fill: #ffffff; }
    .title-sub { font-weight: 600; font-size: 13px; fill: #e2e8f0; letter-spacing: 0.3px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .tag-meta { font-size: 8.5px; font-weight: 700; fill: #cbd5e1; letter-spacing: 1.8px; }
    .lbl-node { font-size: 7.5px; font-weight: 700; fill: #e2e8f0; text-anchor: middle; letter-spacing: 0.6px; }
    .lbl-core { font-size: 8.5px; font-weight: 900; fill: #000000; text-anchor: middle; letter-spacing: 1.6px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 1.4px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#bg-titanium)" stroke="url(#border-titanium)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#titanium-grid)" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.45">
    <line x1="12" y1="16" x2="20" y2="16" />
    <line x1="16" y1="12" x2="16" y2="20" />
    <line x1="860" y1="16" x2="868" y2="16" />
    <line x1="864" y1="12" x2="864" y2="20" />
    <line x1="12" y1="234" x2="20" y2="234" />
    <line x1="16" y1="230" x2="16" y2="238" />
    <line x1="860" y1="234" x2="868" y2="234" />
    <line x1="864" y1="230" x2="864" y2="238" />
  </g>

  <!-- ZONE 1: LEFT — IDENTITY -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2" fill="#ffffff" />
      <text x="12" y="7" class="mono tag-meta">SYSTEMS &amp; ALGORITHMIC ARCHITECTURE</text>
    </g>
    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#94a3b8">•</tspan> AI Agents <tspan fill="#94a3b8">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      Rigorous engineering, systems optimization &amp; production ML
    </text>
  </g>

  <!-- ZONE 2: CENTER — ISOMETRIC 3D TESSERACT & WIREFRAME MESH -->
  <g id="titanium-tesseract">
    <!-- Background Ambient Glow -->
    <circle cx="496" cy="125" r="110" fill="url(#titanium-glow)">
      <animate attributeName="r" values="95;115;95" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Coordinate Axis Guide Vectors -->
    <line x1="496" y1="125" x2="496" y2="35" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="496" y1="125" x2="415" y2="175" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="496" y1="125" x2="577" y2="175" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Outer Isometric Hexagon (Cube Projection) -->
    <polygon points="496,50 566,90 566,160 496,200 426,160 426,90" fill="none" stroke="#475569" stroke-width="1.2">
      <animate attributeName="stroke" values="#475569;#cbd5e1;#475569" dur="4s" repeatCount="indefinite" />
    </polygon>

    <!-- Inner Isometric Tesseract Core -->
    <polygon points="496,80 536,102 536,148 496,170 456,148 456,102" fill="#0f172a" fill-opacity="0.6" stroke="#94a3b8" stroke-width="1.0">
      <animate attributeName="stroke" values="#94a3b8;#ffffff;#94a3b8" dur="3.2s" repeatCount="indefinite" />
    </polygon>

    <!-- Isometric Connection Spokes (Outer to Inner Vertices) -->
    <line x1="496" y1="50" x2="496" y2="80" stroke="#64748b" stroke-width="0.9" />
    <line x1="566" y1="90" x2="536" y2="102" stroke="#64748b" stroke-width="0.9" />
    <line x1="566" y1="160" x2="536" y2="148" stroke="#64748b" stroke-width="0.9" />
    <line x1="496" y1="200" x2="496" y2="170" stroke="#64748b" stroke-width="0.9" />
    <line x1="426" y1="160" x2="456" y2="148" stroke="#64748b" stroke-width="0.9" />
    <line x1="426" y1="90" x2="456" y2="102" stroke="#64748b" stroke-width="0.9" />

    <!-- Internal Coordinate Ray to Center (496, 125) -->
    <line x1="496" y1="80" x2="496" y2="125" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="536" y1="148" x2="496" y2="125" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="456" y1="148" x2="496" y2="125" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Traversal Photon (Tesseract Edge Orbit) -->
    <circle r="2.2" fill="#ffffff">
      <animateMotion path="M 496 50 L 566 90 L 536 102 L 496 80 L 496 125 L 456 148 L 426 160 L 496 200 Z" dur="7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;1;0.3" dur="7.5s" repeatCount="indefinite" />
    </circle>

    <!-- External Dimension Anchors -->
    <g transform="translate(370, 125)">
      <circle cx="0" cy="0" r="11" fill="#0d1017" stroke="#475569" stroke-width="1">
        <animate attributeName="stroke" values="#475569;#cbd5e1;#475569" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">TENSOR</text>
    </g>
    <g transform="translate(622, 125)">
      <circle cx="0" cy="0" r="11" fill="#0d1017" stroke="#475569" stroke-width="1">
        <animate attributeName="stroke" values="#475569;#cbd5e1;#475569" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">MATRIX</text>
    </g>
    <line x1="370" y1="125" x2="426" y2="125" stroke="#334155" stroke-width="0.7" stroke-dasharray="2 2" />
    <line x1="566" y1="125" x2="622" y2="125" stroke="#334155" stroke-width="0.7" stroke-dasharray="2 2" />

    <!-- Central Platinum Core Hub -->
    <g transform="translate(496, 125)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.3">
        <animate attributeName="r" values="24;30;24" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="19" fill="url(#core-titanium)" stroke="#ffffff" stroke-width="1.6">
        <animate attributeName="stroke" values="#ffffff;#94a3b8;#ffffff" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3.5" class="mono lbl-core">CORE</text>
    </g>
  </g>

  <!-- ZONE 3: RIGHT — ARCHITECTURAL TELEMETRY -->
  <g id="titanium-telemetry" transform="translate(720, 54)">
    <text x="0" y="10" class="mono readout-title">SYS // ARCHITECTURE</text>
    <line x1="0" y1="20" x2="114" y2="20" stroke="#334155" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">FRAMEWORK</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">TITANIUM</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">TOPOLOGY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">ISOMETRIC 4D</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">PRECISION</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">IEEE-754 F64</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">INTEGRITY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#ffffff">VERIFIED</text>
    </g>

    <line x1="0" y1="126" x2="114" y2="126" stroke="#334155" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#94a3b8">
        <tspan fill="#ffffff">❯</tspan> monolith.render()
      </text>
      <rect x="92" y="-8" width="3.5" height="8" fill="#ffffff" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
