<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <title>Saffron Singh — Stellar Orbit &amp; Cosmic Intelligence Banner</title>
  <desc>Cosmic Stellar Trajectory &amp; Gravitational Manifold for Saffron Singh</desc>

  <defs>
    <linearGradient id="bg-stellar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0512" />
      <stop offset="50%" stop-color="#180b26" />
      <stop offset="100%" stop-color="#0e0618" />
    </linearGradient>

    <linearGradient id="border-stellar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="solar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0a0512" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <pattern id="stellar-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="0.6" fill="#f59e0b" fill-opacity="0.18" />
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#78350f" stroke-width="0.3" stroke-opacity="0.16" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-name { font-weight: 900; font-size: 42px; letter-spacing: 4px; fill: #fffbeb; }
    .title-sub { font-weight: 600; font-size: 13px; fill: #fbbf24; letter-spacing: 0.2px; }
    .title-desc { font-weight: 400; font-size: 11.5px; fill: #fde68a; opacity: 0.8; }
    .tag-meta { font-size: 8.5px; font-weight: 600; fill: #d97706; letter-spacing: 1.5px; }
    .lbl-node { font-size: 7.5px; font-weight: 700; fill: #fde68a; text-anchor: middle; letter-spacing: 0.5px; }
    .lbl-core { font-size: 8.5px; font-weight: 800; fill: #ffffff; text-anchor: middle; letter-spacing: 1.4px; }
    .readout-title { font-size: 8.5px; font-weight: 700; fill: #f59e0b; letter-spacing: 1.4px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #fcd34d; opacity: 0.7; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #fffbeb; letter-spacing: 0.4px; }
  </style>

  <!-- Outer Shell & Background -->
  <rect x="1" y="1" width="878" height="248" rx="10" fill="url(#bg-stellar)" stroke="url(#border-stellar)" stroke-width="1" />
  <rect x="2" y="2" width="876" height="246" rx="9" fill="url(#stellar-grid)" />

  <!-- Corner Celestial Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.45" />
  <path d="M 868 24 L 868 12 L 856 12" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.45" />
  <path d="M 12 226 L 12 238 L 24 238" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.45" />
  <path d="M 868 226 L 868 238 L 856 238" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.45" />

  <!-- ZONE 1: LEFT — IDENTITY -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2" fill="#f59e0b" />
      <text x="12" y="7" class="mono tag-meta">STELLAR SYSTEMS &amp; COMPUTATION</text>
    </g>
    <text x="0" y="58" class="sans title-name">SAFFRON</text>
    <text x="0" y="88" class="sans title-sub">
      AI/ML Developer <tspan fill="#f59e0b">•</tspan> AI Agents <tspan fill="#f59e0b">•</tspan> Software Engineering
    </text>
    <text x="0" y="112" class="sans title-desc">
      Orbital trajectory dynamics, stellar intelligence &amp; scalable agents
    </text>
  </g>

  <!-- ZONE 2: CENTER — KEPLERIAN GRAVITATIONAL ORBITS -->
  <g id="stellar-manifold">
    <!-- Coronal Solar Flare Atmosphere -->
    <circle cx="496" cy="125" r="115" fill="url(#solar-glow)">
      <animate attributeName="r" values="98;122;98" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Elliptical Keplerian Orbit Tracks (Rotated Coordinates) -->
    <ellipse cx="496" cy="125" rx="100" ry="42" fill="none" stroke="#78350f" stroke-width="0.8" stroke-dasharray="3 4" transform="rotate(-18 496 125)" opacity="0.5">
      <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" dur="4s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="496" cy="125" rx="100" ry="42" fill="none" stroke="#78350f" stroke-width="0.8" stroke-dasharray="3 4" transform="rotate(24 496 125)" opacity="0.5">
      <animate attributeName="stroke" values="#78350f;#f97316;#78350f" dur="5s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="496" cy="125" r="75" fill="none" stroke="#78350f" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.4" />

    <!-- Orbiting Celestial Satellites -->
    <circle r="2.4" fill="#fef08a">
      <animateMotion path="M 396 125 A 100 42 0 1 0 596 125 A 100 42 0 1 0 396 125" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6.5s" repeatCount="indefinite" />
    </circle>
    <circle r="2.0" fill="#f97316">
      <animateMotion path="M 596 125 A 100 42 0 1 1 396 125 A 100 42 0 1 1 596 125" dur="8.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="8.2s" repeatCount="indefinite" />
    </circle>

    <!-- Radial Gravitational Rays -->
    <line x1="496" y1="125" x2="395" y2="70" stroke="#78350f" stroke-width="0.7">
      <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="496" y1="125" x2="395" y2="180" stroke="#78350f" stroke-width="0.7">
      <animate attributeName="stroke" values="#78350f;#f97316;#78350f" dur="4.2s" repeatCount="indefinite" />
    </line>
    <line x1="496" y1="125" x2="597" y2="70" stroke="#78350f" stroke-width="0.7">
      <animate attributeName="stroke" values="#78350f;#fbbf24;#78350f" dur="3.8s" repeatCount="indefinite" />
    </line>
    <line x1="496" y1="125" x2="597" y2="180" stroke="#78350f" stroke-width="0.7">
      <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" dur="4.6s" repeatCount="indefinite" />
    </line>

    <!-- Celestial Peripheral Nodes -->
    <g transform="translate(395, 70)">
      <circle cx="0" cy="0" r="12" fill="#14081c" stroke="#78350f" stroke-width="1">
        <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">PERIAPSIS</text>
    </g>
    <g transform="translate(395, 180)">
      <circle cx="0" cy="0" r="12" fill="#14081c" stroke="#78350f" stroke-width="1">
        <animate attributeName="stroke" values="#78350f;#f97316;#78350f" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">GRAVITY</text>
    </g>
    <g transform="translate(496, 42)">
      <circle cx="0" cy="0" r="11" fill="#14081c" stroke="#78350f" stroke-width="1">
        <animate attributeName="stroke" values="#78350f;#fbbf24;#78350f" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">FLUX</text>
    </g>
    <g transform="translate(496, 208)">
      <circle cx="0" cy="0" r="11" fill="#14081c" stroke="#78350f" stroke-width="1">
        <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" dur="4.0s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">APOAPSIS</text>
    </g>
    <g transform="translate(597, 70)">
      <circle cx="0" cy="0" r="12" fill="#14081c" stroke="#78350f" stroke-width="1">
        <animate attributeName="stroke" values="#78350f;#fbbf24;#78350f" dur="3.8s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">VECTOR</text>
    </g>
    <g transform="translate(597, 180)">
      <circle cx="0" cy="0" r="12" fill="#14081c" stroke="#78350f" stroke-width="1">
        <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" dur="4.6s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.5" class="mono lbl-node">ECLIPSE</text>
    </g>

    <!-- Central Stellar Sun Core -->
    <g transform="translate(496, 125)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.3">
        <animate attributeName="r" values="26;34;26" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.05;0.4" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="21" fill="url(#core-sun)" stroke="#fbbf24" stroke-width="1.6">
        <animate attributeName="stroke" values="#fbbf24;#f97316;#fbbf24" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="3.5" class="mono lbl-core">STELLAR</text>
    </g>
  </g>

  <!-- ZONE 3: RIGHT — STELLAR TELEMETRY -->
  <g id="stellar-telemetry" transform="translate(720, 54)">
    <text x="0" y="10" class="mono readout-title">SYS // STELLAR ORBIT</text>
    <line x1="0" y1="20" x2="114" y2="20" stroke="#78350f" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">TRAJECTORY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">KEPLER-16b</text>
    </g>
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">FLUX EMIT</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">3.84e26 W</text>
    </g>
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">ECCENTRICITY</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end">0.082 e</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">HARMONIC</text>
      <text x="114" y="0" class="mono readout-val" text-anchor="end" fill="#fbbf24">LOCKED</text>
    </g>

    <line x1="0" y1="126" x2="114" y2="126" stroke="#78350f" stroke-width="0.5" opacity="0.6" />

    <g transform="translate(0, 140)">
      <text x="0" y="0" class="mono" font-size="8" fill="#d97706">
        <tspan fill="#f59e0b">❯</tspan> orbit.vector()
      </text>
      <rect x="76" y="-8" width="3.5" height="8" fill="#f59e0b" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
