<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250">
    <defs>
        <linearGradient id="bg_term" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0a0a0a" />
            <stop offset="100%" stop-color="#141414" />
        </linearGradient>
        <style>
            .console-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 20px;
                fill: #33ff33;
                font-weight: bold;
            }
            .prompt { fill: #ff007f; }
            .path { fill: #00e5ff; }
            
            @keyframes type1 {
                0% { opacity: 0; }
                5% { opacity: 1; }
                100% { opacity: 1; }
            }
            @keyframes blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }
        </style>
    </defs>
    
    <rect width="880" height="250" fill="url(#bg_term)" rx="10"/>
    
    <!-- Window Controls -->
    <rect x="0" y="0" width="880" height="35" fill="#222" rx="10"/>
    <rect x="0" y="20" width="880" height="15" fill="#222" />
    <circle cx="20" cy="17" r="6" fill="#ff5f56" />
    <circle cx="40" cy="17" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="17" r="6" fill="#27c93f" />
    <text x="440" y="22" font-family="'Courier New', Courier, monospace" font-size="14" fill="#888" text-anchor="middle">saffron@finpilot: ~</text>

    <!-- Terminal Content -->
    <g transform="translate(30, 80)">
        <text class="console-text"><tspan class="prompt">saffron</tspan>@<tspan class="path">system</tspan>:~$ whoami</text>
        <text class="console-text" y="30" fill="#fff" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.11;1" dur="10s" repeatCount="indefinite"/>
            Saffron Sarbajna
        </text>
        
        <text class="console-text" y="70" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.21;1" dur="10s" repeatCount="indefinite"/>
            <tspan class="prompt">saffron</tspan>@<tspan class="path">system</tspan>:~$ cat skills.txt
        </text>
        <text class="console-text" y="100" fill="#fff" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.31;1" dur="10s" repeatCount="indefinite"/>
            > Data Science | Machine Learning | FinPilot Architect
        </text>

        <text class="console-text" y="140" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.41;1" dur="10s" repeatCount="indefinite"/>
            <tspan class="prompt">saffron</tspan>@<tspan class="path">system</tspan>:~$ <tspan fill="#33ff33"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan>
        </text>
    </g>
    
    <!-- Decorative Grid Overlay -->
    <path d="M 0 50 L 880 50 M 0 100 L 880 100 M 0 150 L 880 150 M 0 200 L 880 200" stroke="#fff" stroke-width="1" opacity="0.02"/>
</svg>